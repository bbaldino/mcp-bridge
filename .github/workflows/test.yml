name: test

# Reusable gate. Both publish-image.yml and release-please.yml `uses:` this, so
# a red main blocks BOTH — no image and no release PR. Ownership lives here so
# the two callers cannot drift apart.
#
# This repo has no source code: it is a Dockerfile pinning supergateway on
# Node 22. So the only meaningful gate is "does the image still build". Without
# it, release-please would happily tag and publish a GitHub Release for a broken
# Dockerfile, with the failing tag build as the only signal.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no registry login, no push. Shares the GHA layer cache with
      # publish-image, so the real build afterwards is mostly cache hits.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
