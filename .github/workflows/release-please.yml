name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt tag
# creation.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on the same build publish-image uses. Without this the two
  # workflows are independent, so a red main still cuts a tag and a GitHub
  # Release for a version that has no image.
  test:
    uses: ./.github/workflows/test.yml

  release-please:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # NOT the default GITHUB_TOKEN: tags it creates do not trigger
          # publish-image.yml, so the release would silently produce no image.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Deliberately NOT gated on `prs_created`. That output is true only when
      # the PR is CREATED, not updated — so one failed merge means every later
      # push updates the PR, this step is skipped, and the repo silently stops
      # releasing with green runs and no error. Querying for an open release PR
      # instead makes this idempotent and self-healing.
      #
      # `--repo` is required: this job has no actions/checkout (release-please
      # is pure API), so gh has no git remote to infer the target from and dies
      # with "fatal: not a git repository".
      #
      # Keep the title match. It is a weak contract, but it fails VISIBLY — an
      # open PR someone can see — rather than silently.
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN: a merge by GITHUB_TOKEN does not trigger
          # the follow-up run that cuts the tag.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
