name: publish-image

# Tags ONLY — deliberately not `branches: [main]`.
#
# Triggering on both built the release commit twice: once when release-please
# merged its PR to main, once when it tagged that same commit. Both runs emitted
# sha-<short>, so it landed on whichever finished last — nondeterminism in the
# one tag whose whole purpose is identifying an exact build.
#
# Tag-only gives one build per release, every tag written exactly once, and
# sha-<short> sharing a digest with the version tags. The cost is no image for
# commits that are never released — with release-please ignoring docs/chore,
# that is exactly the changes nobody deploys.
#
# Tests still run on every push to main: release-please.yml triggers there and
# gates on the same reusable test job.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with release-please.yml so a broken Dockerfile blocks both the image
  # and the release. See test.yml for why a build-only job is the gate here.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two images from one repo, sharing the repo's version. Keep in step
        # with test.yml's matrix.
        include:
          - context: .
            image: mcp-bridge
          - context: images/plex-proxy
            image: mcp-bridge-plex
    name: publish (${{ matrix.image }})
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # No `type=raw,value=latest,enable={{is_default_branch}}` rule here.
          # metadata-action's default `flavor: latest=auto` already applies
          # latest to non-prerelease semver tags. Adding the raw rule too makes
          # latest land on BOTH paths, so it bounces between "tip of main" and
          # "newest release" depending on which workflow ran last.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # No enable= restriction: this workflow only runs on a tag, so
            # sha-<short> is emitted once, by the same build that emits the
            # version tags. All four share one digest.
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
